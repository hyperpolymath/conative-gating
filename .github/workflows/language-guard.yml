# SPDX-License-Identifier: MPL-2.0
# Language Guard - Fire extinguisher when SLM unavailable
# ~20 lines of grep. Zero cost. Catches obvious violations.
name: Language Guard
on:
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.py'
      - '**.go'
      - '**.java'
      - 'package.json'
      - 'bun.lock'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check for forbidden languages
        run: |
          # TypeScript files (not allowed)
          if find . -name "*.ts" -o -name "*.tsx" | grep -q .; then
            echo "::error::TypeScript files detected. Use AffineScript instead."
            exit 1
          fi

          # Python outside salt/ or training/ (not allowed)
          if find . -name "*.py" ! -path "*/salt/*" ! -path "*/training/*" | grep -q .; then
            echo "::error::Python files outside salt/ or training/ detected."
            exit 1
          fi

          # package.json needs bun.lock (Bun first per canonical LANGUAGE-POLICY)
          if [ -f "package.json" ] && [ ! -f "bun.lock" ]; then
            echo "::error::package.json without bun.lock detected."
            exit 1
          fi

          echo "Language guard passed"
