[package]
name = "slm-evaluator"
version = "0.1.0"
edition = "2021"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "SLM bindings for adversarial policy evaluation"
license = "MPL-2.0"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Optional blocking HTTPS client for the remote (OpenAI-compatible) SLM
# provider. Rustls only: no native TLS system dependency is introduced.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "json",
], optional = true }
# llama-cpp-2 = "0.1"  # Uncomment when ready for in-process SLM integration

[features]
# Remote SLM provider over HTTPS. Off by default; local llama.cpp provider
# works without it.
default = []
http = ["dep:reqwest"]
