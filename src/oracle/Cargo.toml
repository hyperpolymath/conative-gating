[package]
name = "policy-oracle"
version = "0.1.0"
edition = "2021"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "Deterministic policy rule checker"
license = "MPL-2.0"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
glob = "0.3"
regex = "1"
# Native Nickel policy evaluation via the reviewed vendor fork in
# vendor/bunsenite (see vendor/bunsenite/VENDOR.adoc). Default features are
# disabled on the vendor fork: no REPL/format/doc/markdown feature load.
bunsenite = { path = "../../vendor/bunsenite", optional = true, default-features = false }

[features]
# Native Nickel (.ncl) policy loading. Off by default: default builds compile
# without the Nickel dependency tree, and .ncl policy files are rejected
# fail-closed instead of being silently ignored.
default = []
nickel = ["dep:bunsenite"]
